[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "uzner"
version = "0.1.0"
description = "Воспроизводимые эксперименты exact-span NER для узбекских текстов"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
train = [
  "huggingface-hub==1.30.0",
  "mlflow>=3.8,<4",
  "nvidia-ml-py>=13,<14",
  "protobuf==7.36.1",
  "psutil>=7,<8",
  "rich==15.0.0",
  "sentencepiece==0.2.1",
  "tokenizers==0.22.2",
  "torch==2.6.0",
  "tqdm==4.70.0",
  "transformers==5.14.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<0.12",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["src/uzner"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=uzner --cov-report=term-missing"
markers = ["train: тесты, требующие PyTorch train-extra"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["uzner"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
exclude = ["ner_uz_hackathon_participant"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
