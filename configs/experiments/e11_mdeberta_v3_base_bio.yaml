experiment:
  run_id: e11_mdeberta_v3_base_bio
  pipeline: uzner
  data_config: configs/data/official.yaml
  output_root: runs
  primary_metric: exact_micro_f1
  encoder:
    name: microsoft/mdeberta-v3-base
    revision: a0484667b22365f84929a935b5e50a51f71f159d
    trust_remote_code: false
  model:
    architecture: token_tagging
    tag_scheme: bio
    head: softmax
    decoder: greedy
    dropout: 0.1
  tokenization:
    max_length: 512
    stride: 128
  training:
    seed: 42
    epochs: 5
    batch_size: 4
    eval_batch_size: 8
    gradient_accumulation_steps: 2
    learning_rate: 0.00002
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    bf16: true
    num_workers: 2
    require_gpu: true
    gradient_checkpointing: false
    log_every_steps: 25
    early_stopping_patience: 2
