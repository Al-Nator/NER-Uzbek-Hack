experiment:
  run_id: a22_xlmr_base_bio_crf
  pipeline: uzner
  data_config: configs/data/official.yaml
  output_root: runs
  primary_metric: exact_micro_f1
  encoder:
    name: FacebookAI/xlm-roberta-base
    revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
    trust_remote_code: false
  model:
    architecture: token_tagging
    tag_scheme: bio
    head: crf
    decoder: crf
    dropout: 0.1
  tokenization:
    max_length: 512
    stride: 128
  training:
    seed: 42
    epochs: 5
    batch_size: 4
    eval_batch_size: 8
    gradient_accumulation_steps: 2
    learning_rate: 0.00002
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    bf16: true
    num_workers: 2
    require_gpu: true
    gradient_checkpointing: false
    log_every_steps: 25
    early_stopping_patience: 2
