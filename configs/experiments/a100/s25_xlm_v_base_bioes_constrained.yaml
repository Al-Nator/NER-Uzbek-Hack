experiment:
  run_id: s25_xlm_v_base_bioes_constrained
  pipeline: uzner
  data_config: configs/data/official.yaml
  output_root: runs
  primary_metric: exact_micro_f1
  encoder:
    name: facebook/xlm-v-base
    revision: 68c75dd7733d2640b3a98114e3e94196dc543fe1
    trust_remote_code: false
    use_safetensors: false
  model:
    architecture: token_tagging
    tag_scheme: bioes
    head: softmax
    decoder: constrained
    dropout: 0.1
  tokenization:
    max_length: 512
    stride: 128
  training:
    seed: 42
    epochs: 5
    batch_size: 8
    eval_batch_size: 8
    gradient_accumulation_steps: 1
    learning_rate: 0.00002
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    bf16: true
    num_workers: 4
    require_gpu: true
    gradient_checkpointing: false
    optimizer: adamw
    log_every_steps: 25
    early_stopping_patience: 2
