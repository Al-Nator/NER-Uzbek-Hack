experiment:
  run_id: s7p2_xlmr_holdout_v1
  pipeline: uzner
  data_config: configs/seventh/holdout_data.yaml
  output_root: runs
  primary_metric: exact_micro_f1
  encoder:
    name: FacebookAI/xlm-roberta-large
    revision: c23d21b0620b635a76227c604d44e43a9f0ee389
    trust_remote_code: false
    use_safetensors: true
  model:
    architecture: span
    head: global_pointer
    decoder: span
    dropout: 0.1
    span_head_size: 64
    span_threshold: 0.5
  tokenization:
    max_length: 512
    stride: 128
  training:
    seed: 42
    epochs: 5
    batch_size: 8
    eval_batch_size: 8
    gradient_accumulation_steps: 1
    learning_rate: 2.0e-05
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_grad_norm: 1.0
    bf16: true
    num_workers: 4
    require_gpu: true
    gradient_checkpointing: false
    log_every_steps: 25
    early_stopping_patience: 2
