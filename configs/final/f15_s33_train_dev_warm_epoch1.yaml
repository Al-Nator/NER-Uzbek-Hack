experiment:
  run_id: f15_s33_train_dev_warm_epoch1
  data_config: configs/data/official.yaml
  encoder:
    name: BAAI/bge-m3-retromae
    revision: 95c4f81ef8f7911dcac8e384532489c32c8dea64
    trust_remote_code: false
    use_safetensors: false
  model:
    architecture: span
    tag_scheme: bio
    head: global_pointer
    decoder: span
    dropout: 0.1
    span_head_size: 64
    span_threshold: 0.5
  tokenization:
    max_length: 512
    stride: 128
  training:
    seed: 42
    epochs: 1
    batch_size: 8
    eval_batch_size: 8
    gradient_accumulation_steps: 1
    learning_rate: 1.0e-06
    weight_decay: 0.01
    warmup_ratio: 0.0
    max_grad_norm: 1.0
    bf16: true
    num_workers: 4
    require_gpu: true
    gradient_checkpointing: false
    optimizer: adamw
    log_every_steps: 25
    early_stopping_patience: 0
    initial_checkpoint: runs/s33_bge_global_pointer_low_lr_a100-low-lr-v1/checkpoints/best
  pipeline: uzner
  output_root: runs
  primary_metric: exact_micro_f1
